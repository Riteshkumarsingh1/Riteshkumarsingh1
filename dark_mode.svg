<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Consolas,monospace" width="985" height="530" font-size="15px">
  <style>
    .key { fill: #ffa657; }
    .value { fill: #a5d6ff; }
    .addColor { fill: #3fb950; }
    .delColor { fill: #f85149; }
    .cc { fill: #616e7f; }
    text, tspan { white-space: pre; }
  </style>

  <!-- Background -->
  <rect width="985" height="530" fill="#161b22" rx="15"/>

  <!-- Your Photo (Circular) -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="180" cy="265" r="145"/>
    </clipPath>
  </defs>
  
  <!-- Photo -->
  <image 
    href="https://raw.githubusercontent.com/Riteshkumarsingh1/Riteshkumarsingh1/main/profile.png" 
    x="35" y="120" 
    width="290" height="290" 
    clip-path="url(#circleClip)" 
    preserveAspectRatio="xMidYMid slice"/>

  <!-- Circular border around photo -->
  <circle cx="180" cy="265" r="147" fill="none" stroke="#30363d" stroke-width="4"/>

  <!-- Right side Terminal Content -->
  <text x="390" y="35" fill="#c9d1d9">
    <tspan x="390" y="35">ritesh@singh</tspan> ————————————————————————————————
    <tspan x="390" y="60" class="cc">. </tspan><tspan class="key">OS</tspan>:<tspan class="cc"> ........................ </tspan><tspan class="value">Windows 11, Android, Linux</tspan>
    <tspan x="390" y="85" class="cc">. </tspan><tspan class="key">Uptime</tspan>:<tspan class="cc" id="age_data_dots"> ...................... </tspan><tspan class="value" id="age_data">22
