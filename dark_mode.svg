<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620">
  <rect width="100%" height="100%" fill="#0a0a0a" rx="10"/>
  
  <!-- Terminal Header -->
  <rect x="10" y="10" width="860" height="35" fill="#1e1e1e" rx="5"/>
  <circle cx="30" cy="27" r="8" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="8" fill="#ffbd2e"/>
  <circle cx="74" cy="27" r="8" fill="#27c93f"/>
  <text x="420" y="33" fill="#c0c0c0" font-family="monospace" font-size="14" text-anchor="middle">ritesh@developer:~/profile</text>

  <!-- Border Box -->
  <rect x="10" y="50" width="860" height="560" fill="none" stroke="#00ff41" stroke-width="1.5" rx="4"/>

  <!-- Left Side: Text Info -->
  <g transform="translate(40, 80)">
    <!-- Profile Photo Area -->
    <rect x="0" y="0" width="120" height="120" fill="#1a1a1a" stroke="#00ff41" stroke-width="2" rx="8"/>
    <image href="https://avatars.githubusercontent.com/riteshkrsingh" x="5" y="5" width="110" height="110" rx="4" />
    <text x="60" y="140" fill="#00ff41" font-family="monospace" font-size="12" text-anchor="middle">🖼️ avatar</text>

    <!-- whoami Section -->
    <text x="150" y="25" fill="#00ff41" font-family="monospace" font-size="16" font-weight="bold">$ whoami</text>
    <text x="150" y="50" fill="#ffffff" font-family="monospace" font-size="15">&gt; Name       : Ritesh Kumar Singh</text>
    <text x="150" y="70" fill="#ffffff" font-family="monospace" font-size="15">&gt; Role       : Data Science Enthusiast</text>
    <text x="150" y="90" fill="#ffffff" font-family="monospace" font-size="15">&gt; Location   : Greater Noida, India</text>
    <text x="150" y="110" fill="#b0b0b0" font-family="monospace" font-size="13">&gt; Motto      : "Code. Learn. Build. Repeat."</text>

    <!-- Divider -->
    <line x1="0" y1="160" x2="800" y2="160" stroke="#00ff41" stroke-width="0.5" stroke-dasharray="4" />

    <!-- current_focus -->
    <text x="0" y="190" fill="#00ff41" font-family="monospace" font-size="16" font-weight="bold">$ current_focus</text>
    
    <text x="10" y="215" fill="#fff" font-family="monospace" font-size="13">Data Structures &amp; Algorithms</text>
    <rect x="320" y="205" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="205" width="135" height="12" fill="#00ff41" rx="6"/>
    <text x="480" y="215" fill="#00ff41" font-family="monospace" font-size="12">90%</text>

    <text x="10" y="240" fill="#fff" font-family="monospace" font-size="13">Data Analytics</text>
    <rect x="320" y="230" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="230" width="135" height="12" fill="#00ff41" rx="6"/>
    <text x="480" y="240" fill="#00ff41" font-family="monospace" font-size="12">90%</text>

    <text x="10" y="265" fill="#fff" font-family="monospace" font-size="13">Generative AI (GenAI)</text>
    <rect x="320" y="255" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="255" width="120" height="12" fill="#00ccff" rx="6"/>
    <text x="480" y="265" fill="#00ccff" font-family="monospace" font-size="12">80%</text>

    <text x="10" y="290" fill="#fff" font-family="monospace" font-size="13">RAG Systems</text>
    <rect x="320" y="280" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="280" width="112" height="12" fill="#00ccff" rx="6"/>
    <text x="480" y="290" fill="#00ccff" font-family="monospace" font-size="12">75%</text>

    <text x="10" y="315" fill="#fff" font-family="monospace" font-size="13">LLMs / Prompt Engineering</text>
    <rect x="320" y="305" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="305" width="112" height="12" fill="#00ccff" rx="6"/>
    <text x="480" y="315" fill="#00ccff" font-family="monospace" font-size="12">75%</text>

    <text x="10" y="340" fill="#fff" font-family="monospace" font-size="13">System Design</text>
    <rect x="320" y="330" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="330" width="90" height="12" fill="#f0ad4e" rx="6"/>
    <text x="480" y="340" fill="#f0ad4e" font-family="monospace" font-size="12">60%</text>

    <text x="10" y="365" fill="#fff" font-family="monospace" font-size="13">Cloud (AWS/GCP)</text>
    <rect x="320" y="355" width="150" height="12" fill="#222" rx="6"/>
    <rect x="320" y="355" width="82" height="12" fill="#f0ad4e" rx="6"/>
    <text x="480" y="365" fill="#f0ad4e" font-family="monospace" font-size="12">55%</text>

    <!-- Divider -->
    <line x1="0" y1="390" x2="800" y2="390" stroke="#00ff41" stroke-width="0.5" stroke-dasharray="4" />

    <!-- Projects -->
    <text x="0" y="415" fill="#00ff41" font-family="monospace" font-size="16" font-weight="bold">$ projects</text>
    <text x="10" y="440" fill="#fff" font-family="monospace" font-size="13">├── 🩸 BLOOD-BANK-          – Full-stack donation management</text>
    <text x="10" y="460" fill="#fff" font-family="monospace" font-size="13">├── 📊 Diwali Sales Analysis – EDA of 11,251 transactions</text>
    <text x="10" y="480" fill="#fff" font-family="monospace" font-size="13">├── 🤖 Gemini ChatBot        – AI chatbot using Google Gemini</text>
    <text x="10" y="500" fill="#fff" font-family="monospace" font-size="13">├── 🧠 RAG Knowledge Base    – Retrieval-Augmented Generation app</text>
    <text x="10" y="520" fill="#fff" font-family="monospace" font-size="13">└── 🌐 Portfolio Website     – React + Tailwind + Framer Motion</text>

    <!-- Divider -->
    <line x1="0" y1="545" x2="800" y2="545" stroke="#00ff41" stroke-width="0.5" stroke-dasharray="4" />

    <!-- GitHub STATS (Dynamic Placeholders) -->
    <text x="0" y="570" fill="#00ff41" font-family="monospace" font-size="16" font-weight="bold">$ github_stats</text>
    
    <text x="10" y="595" fill="#fff" font-family="monospace" font-size="13">🗂️ Repositories : {{ repo_count }}</text>
    <text x="220" y="595" fill="#fff" font-family="monospace" font-size="13">⭐ Stars : {{ star_count }}</text>
    <text x="420" y="595" fill="#fff" font-family="monospace" font-size="13">👥 Followers : {{ follower_count }}</text>
    <text x="620" y="595" fill="#fff" font-family="monospace" font-size="13">📝 Commits : {{ commit_count }}</text>
    
    <text x="10" y="620" fill="#8b949e" font-family="monospace" font-size="12">💻 Code. Learn. Build. Repeat. 🔥 Updated: {{ update_time }}</text>

  </g>
</svg>
