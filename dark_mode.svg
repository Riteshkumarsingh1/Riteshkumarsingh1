<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
  <rect width="100%" height="100%" fill="#0a0a0a" rx="10"/>
  
  <!-- Terminal Title Bar -->
  <rect x="10" y="10" width="880" height="40" fill="#1e1e1e" rx="6"/>
  <circle cx="35" cy="30" r="9" fill="#ff5f56"/>
  <circle cx="60" cy="30" r="9" fill="#ffbd2e"/>
  <circle cx="85" cy="30" r="9" fill="#27c93f"/>
  <text x="450" y="36" fill="#c0c0c0" font-family="monospace" font-size="15" text-anchor="middle">ritesh@github:~/profile</text>

  <!-- Main Border -->
  <rect x="10" y="55" width="880" height="615" fill="none" stroke="#00ff41" stroke-width="2" rx="4"/>

  <g transform="translate(35, 75)">
    <!-- Top Row: Photo + whoami -->
    <!-- Photo Box -->
    <rect x="0" y="0" width="140" height="140" fill="#111" stroke="#00ff41" stroke-width="2" rx="10"/>
    <image href="https://avatars.githubusercontent.com/riteshkrsingh" x="6" y="6" width="128" height="128" rx="6" />
    <text x="70" y="168" fill="#00ff41" font-family="monospace" font-size="13" text-anchor="middle">📸 avatar</text>

    <!-- whoami Output -->
    <text x="170" y="30" fill="#00ff41" font-family="monospace" font-size="17" font-weight="bold">$ whoami</text>
    <text x="170" y="55" fill="#ffffff" font-family="monospace" font-size="16">&gt; Ritesh Kumar Singh</text>
    <text x="170" y="78" fill="#00ff41" font-family="monospace" font-size="15">&gt; Data Science Enthusiast</text>
    <text x="170" y="98" fill="#00ff41" font-family="monospace" font-size="15">&gt; Full-Stack Developer</text>
    <text x="170" y="120" fill="#b0b0b0" font-family="monospace" font-size="14">&gt; Greater Noida, India</text>
    <text x="170" y="142" fill="#8b949e" font-family="monospace" font-size="13">&gt; "Code. Learn. Build. Repeat."</text>

    <!-- Divider -->
    <line x1="0" y1="185" x2="830" y2="185" stroke="#00ff41" stroke-width="1" stroke-dasharray="6,4" />

    <!-- Current Focus (Progress Bars) -->
    <text x="0" y="215" fill="#00ff41" font-family="monospace" font-size="17" font-weight="bold">$ current_focus</text>

    <text x="15" y="242" fill="#fff" font-family="monospace" font-size="14">Data Structures &amp; Algorithms</text>
    <rect x="380" y="229" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="229" width="162" height="14" fill="#00ff41" rx="7"/>
    <text x="575" y="242" fill="#00ff41" font-family="monospace" font-size="13">90%</text>

    <text x="15" y="270" fill="#fff" font-family="monospace" font-size="14">Data Analytics</text>
    <rect x="380" y="257" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="257" width="162" height="14" fill="#00ff41" rx="7"/>
    <text x="575" y="270" fill="#00ff41" font-family="monospace" font-size="13">90%</text>

    <text x="15" y="298" fill="#fff" font-family="monospace" font-size="14">Generative AI (GenAI)</text>
    <rect x="380" y="285" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="285" width="144" height="14" fill="#00ccff" rx="7"/>
    <text x="575" y="298" fill="#00ccff" font-family="monospace" font-size="13">80%</text>

    <text x="15" y="326" fill="#fff" font-family="monospace" font-size="14">RAG Systems</text>
    <rect x="380" y="313" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="313" width="135" height="14" fill="#00ccff" rx="7"/>
    <text x="575" y="326" fill="#00ccff" font-family="monospace" font-size="13">75%</text>

    <text x="15" y="354" fill="#fff" font-family="monospace" font-size="14">LLMs / Prompt Engineering</text>
    <rect x="380" y="341" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="341" width="135" height="14" fill="#00ccff" rx="7"/>
    <text x="575" y="354" fill="#00ccff" font-family="monospace" font-size="13">75%</text>

    <text x="15" y="382" fill="#fff" font-family="monospace" font-size="14">System Design</text>
    <rect x="380" y="369" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="369" width="108" height="14" fill="#f0ad4e" rx="7"/>
    <text x="575" y="382" fill="#f0ad4e" font-family="monospace" font-size="13">60%</text>

    <text x="15" y="410" fill="#fff" font-family="monospace" font-size="14">Cloud (AWS/GCP)</text>
    <rect x="380" y="397" width="180" height="14" fill="#222" rx="7"/>
    <rect x="380" y="397" width="99" height="14" fill="#f0ad4e" rx="7"/>
    <text x="575" y="410" fill="#f0ad4e" font-family="monospace" font-size="13">55%</text>

    <!-- Divider -->
    <line x1="0" y1="435" x2="830" y2="435" stroke="#00ff41" stroke-width="1" stroke-dasharray="6,4" />

    <!-- Projects -->
    <text x="0" y="465" fill="#00ff41" font-family="monospace" font-size="17" font-weight="bold">$ projects</text>
    <text x="15" y="490" fill="#fff" font-family="monospace" font-size="14">├── 🩸 BLOOD-BANK-          – Full-stack donation management</text>
    <text x="15" y="512" fill="#fff" font-family="monospace" font-size="14">├── 🧠 RAG Knowledge Base    – Retrieval-Augmented Generation app</text>
    <text x="15" y="534" fill="#fff" font-family="monospace" font-size="14">├── 🤖 Gemini ChatBot        – AI chatbot using Google Gemini</text>
    <text x="15" y="556" fill="#fff" font-family="monospace" font-size="14">├── 📊 Diwali Sales Analysis – EDA of 11,251 transactions</text>
    <text x="15" y="578" fill="#fff" font-family="monospace" font-size="14">└── 🌐 Portfolio Website     – React + Tailwind + Framer Motion</text>

    <!-- Divider -->
    <line x1="0" y1="600" x2="830" y2="600" stroke="#00ff41" stroke-width="1" stroke-dasharray="6,4" />

    <!-- Stats & Footer -->
    <text x="0" y="625" fill="#00ff41" font-family="monospace" font-size="17" font-weight="bold">$ github_stats</text>
    
    <text x="15" y="650" fill="#fff" font-family="monospace" font-size="14">🗂️ Repos : {{ repo_count }}</text>
    <text x="200" y="650" fill="#fff" font-family="monospace" font-size="14">⭐ Stars : {{ star_count }}</text>
    <text x="400" y="650" fill="#fff" font-family="monospace" font-size="14">👥 Followers : {{ follower_count }}</text>
    <text x="610" y="650" fill="#fff" font-family="monospace" font-size="14">📝 Commits : {{ commit_count }}</text>

    <text x="15" y="680" fill="#8b949e" font-family="monospace" font-size="12">🔁 Auto-updated: {{ update_time }}</text>
  </g>
</svg>
