name: Update README
on:
  schedule:
    - cron: '0 0 * * *'  # Roz raat 12 baje (UTC)
  workflow_dispatch:      # Manually bhi run kar sakte ho

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python today.py  # Script run karo
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Updated README with new data"
